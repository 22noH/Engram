# npm 신뢰 게시(OIDC) — 토큰·2FA 코드 없이 GitHub Actions가 직접 npm에 게시한다.
# npm 웹 Settings → Trusted Publisher에 이 파일 이름(npm-publish.yml)을 등록해야 동작한다.
name: npm-publish

on:
  # v* 태그를 밀면 데스크톱 릴리스(desktop-release.yml)와 함께 npm도 게시된다.
  push:
    tags: ['v*']
  # 태그 없이 손으로 돌리고 싶을 때(예: 게시만 재시도).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # ← OIDC 신뢰 게시의 핵심. 없으면 인증 실패한다.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # 신뢰 게시는 npm 11.5.1+ 에서만 된다. setup-node가 주는 npm이 더 낮을 수 있어 명시적으로 올린다.
      - run: npm install -g npm@latest

      - run: npm ci

      # 태그가 버전의 단일 출처(사용자 결정): v0.0.15를 밀면 그 숫자가 package.json·plugin.json에
      # 적용된다. 사람이 미리 버전을 올릴 필요 없음. 수동 실행(workflow_dispatch)이면 파일 값 그대로.
      - name: Apply version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/apply-tag-version.js "$GITHUB_REF_NAME"

      # 앱·npm·플러그인 버전은 항상 같아야 한다. 위 단계가 셋을 맞추므로 여기선 확인만.
      - run: npm run version:check

      # package.json의 files가 dist·console/dist를 싣는다 — 둘 다 최신이어야 한다.
      - run: npm run build
      - run: npm run console:build

      # 이미 올라간 버전이면 조용히 건너뛴다(태그를 다시 밀거나 재실행해도 빨갛게 실패하지 않게).
      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER 은 이미 게시됨 — 건너뜀"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC라 NODE_AUTH_TOKEN이 필요 없다. provenance(출처 증명)도 자동으로 붙는다.
      - name: Publish
        if: steps.check.outputs.already == 'false'
        run: npm publish

      # 저장소의 버전 파일도 태그에 맞춰 되돌려 둔다 — 안 하면 main의 package.json이 옛 숫자에
      # 머물러 나중에 "지금 배포된 게 몇 버전이지?"가 헷갈린다. 실패해도 릴리스는 이미 끝났으므로
      # 워크플로를 빨갛게 만들지 않는다(continue-on-error).
      - name: Sync version files back to main
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          VER=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout -B main origin/main
          node scripts/apply-tag-version.js "$GITHUB_REF_NAME"
          if git diff --quiet -- package.json plugin/.claude-plugin/plugin.json; then
            echo "main already at $VER — nothing to sync"
            exit 0
          fi
          git commit -m "chore(release): v$VER [skip ci]" -- package.json plugin/.claude-plugin/plugin.json
          git push origin main
